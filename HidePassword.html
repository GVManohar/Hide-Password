<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<style>
  body {
    box-sizing: border-box;
    height: 90vh;
    background-color: #826afb;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  input {
    border: solid 1.5px rgb(200, 201, 200);
    border-radius: 7px;
    background: none;
    padding: 17px;
    font-size: 20px;
    color: #fff;
    outline: none;
  }

  ::placeholder {
    color: #fff;
  }

  i {
    border-radius: 7px;
    background-color: #826afb;
    padding: 17px;
    font-size: 25px;
    color: #fff;
    font-family: math;
  }
</style>
<body>
  <input type="password" id="inp" placeholder="Enter password" />&nbsp;
  <i class="fa-solid fa-eye" id="eye" onclick="Pass()"></i>

  <script>
    function Pass() {
      let inp = document.querySelector("#inp").getAttribute("type")
      if (inp == "password") {
        document.querySelector("#inp").setAttribute("type", "text")
        document.querySelector("#eye").getAttribute("class", "fa-sharp fa-solid fa-eye-slash")
      }
      else {
        document.querySelector("#inp").setAttribute("type", "password")
        document.querySelector("#eye").getAttribute("class", "fa-solid fa-eye")
      }
    }
  </script>
</body>
</html>
